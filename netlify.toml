# Invest Moz — static deployment (prerendered pages + client-rendered SPA shell).

[build]
  command = "npm run build"
  publish = "dist/invest-moz/browser"

[build.environment]
  NODE_VERSION = "24"

# Root goes to the Portuguese landing page.
[[redirects]]
  from = "/"
  to = "/pt"
  status = 302
  force = true

# SPA fallback for client-rendered routes. Not forced, so prerendered pages
# (e.g. /pt, /en/questions/tax) and static files always win.
[[redirects]]
  from = "/*"
  to = "/index.csr.html"
  status = 200

# Content-Security-Policy is generated at build time into the publish folder
# (_headers) by scripts/postbuild.mjs, with hashes for the inline scripts that
# Angular hydration emits. The headers below apply in addition.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"

# Long-lived caching for hashed files (main-*.js, chunk-*.js, styles-*.css, media/*)
# and X-Robots-Tag: noindex for the inbox, login and demo routes are written to
# _headers by scripts/postbuild.mjs with explicit paths (Netlify header paths
# only support trailing splats).
